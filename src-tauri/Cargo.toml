[package]
name = "nano-route"
version = "0.1.0"
description = "Nano Route - Desktop AI Orchestration Application"
authors = ["Nano Route Engineering"]
edition = "2021"

[lib]
name = "nano_route_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-util = { version = "0.7", features = ["sync"] }
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
